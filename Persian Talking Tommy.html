<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی چت با تامی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Tahoma, sans-serif;
            overflow: hidden;
            position: fixed;
        }
        #chat-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #111;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #screen-area {
            flex: 1;
            /* پیش‌فرض روی عکس اول */
            background: url('pak1.png') no-repeat center center;
            background-size: contain; 
            background-color: #000; 
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            overflow-y: auto;
            transition: background-image 0.1s ease; /* تغییر نرم عکس */
        }
        #dialogue-box {
            background: rgba(180, 20, 20, 0.95);
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            width: 100%;
            border: 1px solid #ff4d4d;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #input-area {
            display: flex;
            padding: 12px;
            background: #222;
            gap: 8px;
            border-top: 1px solid #333;
        }
        #chat-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: #333;
            color: white;
            font-size: 15px;
        }
        .btn-style {
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 15px;
        }
        #mic-btn {
            background: #3498db;
        }
        #mic-btn:hover {
            background: #2980b9;
        }
        #mic-btn.recording {
            background: #e74c3c;
            animation: pulse 1.2s infinite;
        }
        #send-btn {
            background: #e74c3c;
        }
        #send-btn:hover {
            background: #c0392b;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<!-- پخش‌کننده صوتی مخفی برای صدای تامی -->
<audio id="tummy-audio" src="pak3.mp3" preload="auto"></audio>

<div id="chat-container">
    <div id="screen-area" id="screen-bg">
        <div id="dialogue-box"><b>تامی:</b> سلام داداش گلوم! من تامی هستم. می‌تونی بنویسی یا روی میکروفون بزنی و حرف بزنی.</div>
    </div>
    
    <div id="input-area">
        <input type="text" id="chat-input" placeholder="پیام خود را بنویسید یا بگویید..." onkeypress="checkEnter(event)">
        <button id="mic-btn" class="btn-style" onclick="startVoiceInput()" title="صحبت کردن">🎙️</button>
        <button id="send-btn" class="btn-style" onclick="sendMessage()">ارسال</button>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('tummy-audio');
    const screenArea = document.getElementById('screen-area');

    // وقتی صدا شروع به پخش میشه، عکس پس‌زمینه میشه pak2.png
    audioPlayer.onplay = function() {
        screenArea.style.backgroundImage = "url('pak2.png')";
    };

    // وقتی صدا تموم میشه، عکس پس‌زمینه برمی‌گرده به pak1.png
    audioPlayer.onended = function() {
        screenArea.style.backgroundImage = "url('pak1.png')";
    };

    function checkEnter(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // قابلیت تشخیص صدا (Speech Recognition)
    function startVoiceInput() {
        const input = document.getElementById('chat-input');
        const micBtn = document.getElementById('mic-btn');

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('مرورگر شما از قابلیت تشخیص صدا پشتیبانی نمی‌کند.');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        recognition.lang = 'fa-IR';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        micBtn.classList.add('recording');
        input.placeholder = "در حال گوش دادن... صحبت کنید";

        recognition.onresult = function(event) {
            const speechToText = event.results[0][0].transcript;
            input.value = speechToText; 
        };

        recognition.onerror = function(event) {
            console.log("خطا در تشخیص صدا: " + event.error);
            micBtn.classList.remove('recording');
            input.placeholder = "پیام خود را بنویسید یا بگویید...";
        };

        recognition.onend = function() {
            micBtn.classList.remove('recording');
            input.placeholder = "پیام خود را بنویسید یا بگویید...";
            if(input.value.trim() !== "") {
                sendMessage(); 
            }
        };

        recognition.start();
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const dialogue = document.getElementById('dialogue-box');
        const userText = input.value.trim();

        if (userText === "") return;

        // نمایش پیام کاربر
        dialogue.innerHTML = `<b>تو:</b> ${userText}`;
        input.value = "";
        input.disabled = true;

        // مغز کامل و جامع تامی
        setTimeout(() => {
            let reply = "متوجه منظورت نشدم داداش گلم! می‌شه بیشتر توضیح بدی تا بهتر راهنماییت کنم؟";
            const textLower = userText.toLowerCase();

            if (textLower.includes("سلام") || textLower.includes("درود") || textLower.includes("الو") || textLower.includes("سلام علیکم")) {
                reply = "سلام و درود به داداش گل خودم! چطور می‌تونم کمکت کنم؟";
            } else if (textLower.includes("خوبی") || textLower.includes("چطوری") || textLower.includes("اوضاع چطوره")) {
                reply = "فدات شم، من که عالی‌ام! تو چطوری؟ خوش می‌‌گذره؟";
            } else if (textLower.includes("چکار میکنی") || textLower.includes("چه خبر") || textLower.includes("چیکار داری میکنی")) {

            } else if (textLower.includes("دعا") || textLower.includes("خیر") || textLower.includes("عاقبت بخیر")) {
                reply = "الهی آمین! ان‌شاءالله همه‌چیز طبق مراد دلت پیش بره.";
            } else if (textLower.includes("مهم نیست") || textLower.includes("ولش کن") || textLower.includes("بیخیال")) {

            } else if (textLower.includes("نه") || textLower.includes("اصلاً") || textLower.includes("خیر")) {
                reply = "چشم، پس این گزینه رو کلاً فاکتور می‌گیریم.";
            } else if (textLower.includes("شاید") || textLower.includes("نمیدونم") || textLower.includes("باید فکر کنم")) {
                reply = "باشه، عجله‌ای نیست. سر فرصت فکر کن و خبرم کن.";
