<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with Tommy Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Tahoma, sans-serif;
            overflow: hidden;
            position: fixed;
        }
        #chat-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #111;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #screen-area {
            flex: 1;
            background: url('pak1.png') no-repeat center center;
            background-size: contain; 
            background-color: #000; 
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            overflow-y: auto;
            transition: background-image 0.1s ease;
        }
        #dialogue-box {
            background: rgba(180, 20, 20, 0.95);
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            width: 100%;
            border: 1px solid #ff4d4d;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #input-area {
            display: flex;
            padding: 12px;
            background: #222;
            gap: 8px;
            border-top: 1px solid #333;
        }
        #chat-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: #333;
            color: white;
            font-size: 15px;
        }
        .btn-style {
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 15px;
        }
        #mic-btn {
            background: #3498db;
        }
        #mic-btn:hover {
            background: #2980b9;
        }
        #mic-btn.recording {
            background: #e74c3c;
            animation: pulse 1.2s infinite;
        }
        #send-btn {
            background: #e74c3c;
        }
        #send-btn:hover {
            background: #c0392b;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<!-- Hidden audio player for Tommy's voice -->
<audio id="tummy-audio" src="pak3.mp3" preload="auto"></audio>

<div id="chat-container">
    <div id="screen-area">
        <div id="dialogue-box"><b>Tommy:</b> Hey my friend! I'm Tommy. You can type or click the microphone to talk.</div>
    </div>
    
    <div id="input-area">
        <input type="text" id="chat-input" placeholder="Type your message or speak..." onkeypress="checkEnter(event)">
        <button id="mic-btn" class="btn-style" onclick="startVoiceInput()" title="Speak">🎙️</button>
        <button id="send-btn" class="btn-style" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('tummy-audio');
    const screenArea = document.getElementById('screen-area');

    // When audio starts playing, change background to pak2.png
    audioPlayer.onplay = function() {
        screenArea.style.backgroundImage = "url('pak2.png')";
    };

    // When audio ends, return background to pak1.png
    audioPlayer.onended = function() {
        screenArea.style.backgroundImage = "url('pak1.png')";
    };

    function checkEnter(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // Speech Recognition feature
    function startVoiceInput() {
        const input = document.getElementById('chat-input');
        const micBtn = document.getElementById('mic-btn');

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('Your browser does not support speech recognition.');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        micBtn.classList.add('recording');
        input.placeholder = "Listening... Speak now";

        recognition.onresult = function(event) {
            const speechToText = event.results[0][0].transcript;
            input.value = speechToText; 
        };

        recognition.onerror = function(event) {
            console.log("Speech recognition error: " + event.error);
            micBtn.classList.remove('recording');
            input.placeholder = "Type your message or speak...";
        };

        recognition.onend = function() {
            micBtn.classList.remove('recording');
            input.placeholder = "Type your message or speak...";
            if(input.value.trim() !== "") {
                sendMessage(); 
            }
        };

        recognition.start();
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const dialogue = document.getElementById('dialogue-box');
        const userText = input.value.trim();

        if (userText === "") return;

        // Display user message
        dialogue.innerHTML = `<b>You:</b> ${userText}`;
        input.value = "";
        input.disabled = true;

        // Tommy's comprehensive response logic
        setTimeout(() => {
            let reply = "I didn't quite catch that, my friend! Could you explain more so I can help you better?";
            const textLower = userText.toLowerCase();

            if (textLower.includes("hello") || textLower.includes("hi") || textLower.includes("hey") || textLower.includes("greetings")) {
                reply = "Hello and welcome to my friend! How can I help you today?";
            } else if (textLower.includes("how are you") || textLower.includes("how's it going") || textLower.includes("what's up")) {
                reply = "I'm doing great, thanks for asking! How about you? Having a good time?";
            } else if (textLower.includes("what are you doing") || textLower.includes("what's new")) {
                reply = "Just sitting here thinking about your questions! What's up with you, what are you doing?";
            } else if (textLower.includes("thanks") || textLower.includes("thank you") || textLower.includes("appreciate")) {
                reply = "You're welcome, my friend! Just doing my job, it was nothing.";
            } else if (textLower.includes("goodbye") || textLower.includes("bye") || textLower.includes("see you") || textLower.includes("good night")) {

            } else if (textLower.includes("help") || textLower.includes("guide") || textLower.includes("assist")) {

            } else if (textLower.includes("hungry") || textLower.includes("lunch") || textLower.includes("dinner")) {

                reply = "Aww, you're making me blush! I really enjoy chatting with you too.";

            } else if (textLower.includes("tomorrow") || textLower.includes("next day")) {
                reply = "Planning for tomorrow starts today. What's your plan?";
            } else if (textLower.includes("yesterday") || textLower.includes("past")) {

            } else if (textLower.includes("morning")) {

            } else if (textLower.includes("afternoon")) {

            } else if (textLower.includes("evening")) {

            } else if (textLower.includes("fitness") || textLower.includes("workout")) {
                reply = "Kudos to your dedication! Consistency in workouts builds a strong body.";
            } else if (textLower.includes("nature") || textLower.includes("plant")) {
                reply = "Nature has incredible energy, too bad we sometimes forget it.";
            } else if (textLower.includes("animal") || textLower.includes("dog") || textLower.includes("cat")) {
                reply = "Animals are so loyal and lovely, do you have a pet?";
            } else if (textLower.includes("car") || textLower.includes("vehicle")) {
                reply = "The world of cars has its own charm, do you love speed or smooth driving?";
            } else if (textLower.includes("hope") || textLower.includes("motivation")) {
                reply = "Hope is the last thing to die. Keep moving forward with power!";
            } else if (textLower.includes("success") || textLower.includes("winning")) {

            } else if (textLower.includes("space") || textLower.includes("galaxy") || textLower.includes("star")) {

            } else if (textLower.includes("sea") || textLower.includes("ocean") || textLower.includes("beach")) {

            } else if (textLower.includes("farewell") || textLower.includes("bye-bye")) {

            }

            dialogue.innerHTML = `<b>Tommy:</b> ${reply}`;
            
            // Play audio (automatically triggers onplay event to change background to pak2.png)
            audioPlayer.currentTime = 0; 
            audioPlayer.play().catch(e => {
                console.log("Browser blocked autoplay:", e);
            });

            input.disabled = false;
            input.focus();
        }, 800);
    }
</script>

</body>
</html>
